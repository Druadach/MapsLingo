name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both architectures
        run: bash build.sh
      - name: Verify and package
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: MapsLingo
          path: dist/
          if-no-files-found: error
